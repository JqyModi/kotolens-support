name: 问题与建议
description: 反馈功能异常或体验建议
title: "[反馈] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿提交手机号、访问凭据、原始照片或其他敏感信息。
  - type: dropdown
    id: type
    attributes:
      label: 反馈类型
      options:
        - 功能异常
        - 体验建议
        - 隐私与数据
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 详细描述
      placeholder: 请描述发生了什么、预期是什么，以及复现步骤。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与版本
      placeholder: 例如：iPhone 15，iOS 18.5，镜词 0.1.0
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不包含敏感信息。
          required: true
